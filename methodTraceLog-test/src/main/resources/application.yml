method-trace-log:
  log:
    enable: true          # 是否启用方法追踪，默认true
    serviceCalls: # 启动时便开启的日志服务，默认无需配置全部开启，生产环境可以配置全部关闭，在需要时可通过web界面开启
      - name: CustomLog  # 日志输出服务
        enable: false
  file:
    enable: true        # 是否启用文件相关功能，默认true
    path: ./logs        # 日志文件路径，默认为项目根目录下的logs文件夹
    allowed-extensions:    # 允许访问的文件扩展名
      - .log
      - .txt
      - .out
    scan-lines: 10000  # 流式扫描的最大行数上限(也是内存的实际安全网,与分页 pageSize 无关)。1~2MB 内存,中等生产服务能覆盖 1~2 小时窗口
  security:
    api-key: ${METHOD_TRACE_LOG_API_KEY:}    # 从环境变量读取,默认空(dev 模式,不鉴权)
  decompile:
    timeout-seconds: 10
management:
  endpoints:
    web:
      exposure:
        include: methodtrace
server:
  port: 8080
