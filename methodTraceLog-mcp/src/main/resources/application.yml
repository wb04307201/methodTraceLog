spring:
  main:
    web-application-type: none
    banner-mode: off
  # Round 15 (MCP-R-08): give Spring 30s to drain on SIGTERM / Ctrl+C before forcing shutdown.
  # The CloseableHttpClient connection pool must be closed in that window to avoid leaks.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  ai:
    mcp:
      server:
        name: methodTraceLog-mcp-server
        version: @project.version@

# Hosts to expose to AI agents. Each host must be a running Spring Boot app
# that has the methodTraceLog-spring-boot-starter on the classpath.
method-trace-log:
  mcp:
    hosts:
      - name: local-dev
        url: http://localhost:8080
        description: 本地开发主机
        api-key: test-secret-1234   # 与 method-trace-log.security.api-key 保持一致；未启用鉴权则留空

logging:
  file:
    name: ./mcp/method-trace-log-mcp-server.log
