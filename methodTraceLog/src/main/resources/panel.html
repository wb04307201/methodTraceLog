<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方法观测日志 - 控制台</title>
    <link rel="stylesheet" type="text/css" href="/static/panel.css"/>
    <script src="/static/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="/static/stompjs/7.1.1/stomp.umd.min.js"></script>
    <script src="/static/mtlIcons.js"></script>
    <script src="/static/mtlAuth.js"></script>
    <script src="/static/panel.js"></script>
    <script src="/static/overview.js"></script>
    <script src="/static/traces.js"></script>
    <script src="/static/logs.js"></script>
    <script src="/static/decompile.js"></script>
</head>
<body>
    <header class="mtl-topbar">
        <div class="mtl-topbar-left">
            <span class="mtl-title"><span data-icon="chart-bar"></span><span>方法观测日志</span></span>
        </div>
        <nav class="mtl-tabs" id="mtlTabs">
            <a class="mtl-tab" href="#overview" data-tab="overview">概览</a>
            <a class="mtl-tab" href="#traces"   data-tab="traces">调用记录</a>
            <a class="mtl-tab" href="#logs"     data-tab="logs">日志文件</a>
            <a class="mtl-tab" href="#decompile" data-tab="decompile">反编译</a>
        </nav>
        <div class="mtl-topbar-right">
            <button id="mtlThemeToggle" class="mtl-theme-toggle" type="button" title="切换主题" aria-label="切换主题" data-icon="moon"></button>
            <span id="mtlLogoutSlot"></span>
        </div>
    </header>

    <div id="mtlAuthSlot"></div>

    <main class="mtl-main">
        <!-- ===== 概览 tab ===== -->
        <section class="mtl-tab-panel" data-tab="overview" hidden>
            <div class="summary-cards">
                <div class="card card-primary">
                    <div class="card-title">调用次数</div>
                    <div class="card-text" id="totalCount">0</div>
                </div>
                <div class="card card-success">
                    <div class="card-title">成功</div>
                    <div class="card-text" id="successCount">0</div>
                </div>
                <div class="card card-info">
                    <div class="card-title">成功率</div>
                    <div class="card-text" id="avgSuccessRate">0%</div>
                </div>
            </div>

            <div class="control-panel" id="call-service-container">
                <!-- 服务开关 + 自动注入的登出按钮 -->
            </div>

            <div class="control-panel control-panel-flex">
                <button id="refreshBtn" class="btn btn-primary">刷新数据</button>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="autoRefresh">
                    <label for="autoRefresh">自动刷新</label>
                </div>
                <select id="refreshInterval" class="form-select">
                    <option value="5000">5秒</option>
                    <option value="10000" selected>10秒</option>
                    <option value="30000">30秒</option>
                    <option value="60000">1分钟</option>
                </select>
            </div>

            <div class="table-container">
                <div class="table-header"><h4>详细统计</h4></div>
                <div id="methodtrace">
                    <div class="loading"><div class="spinner"></div><p>正在加载数据...</p></div>
                </div>
            </div>

            <div class="table-container">
                <div class="table-header"><h4>最近8小时日志</h4></div>
                <div id="method">
                    <div class="loading"><div class="spinner"></div><p>正在加载数据...</p></div>
                </div>
            </div>
        </section>

        <!-- ===== 调用记录 tab ===== -->
        <section class="mtl-tab-panel" data-tab="traces" hidden>
            <div class="control-panel control-panel-flex">
                <div class="form-group-inline">
                    <label>类名</label>
                    <input type="text" id="traceClassName" placeholder="含子串匹配">
                </div>
                <div class="form-group-inline">
                    <label>方法名</label>
                    <input type="text" id="traceMethodName" placeholder="含子串匹配">
                </div>
                <div class="form-group-inline">
                    <label>状态</label>
                    <select id="traceOnlyErrors">
                        <option value="false">全部</option>
                        <option value="true">仅失败</option>
                    </select>
                </div>
                <div class="form-group-inline">
                    <label>每页</label>
                    <select id="traceLimit">
                        <option value="200">200</option>
                        <option value="500">500</option>
                        <option value="1000" selected>1000</option>
                        <option value="2000">2000</option>
                    </select>
                </div>
                <button id="traceSearchBtn" class="btn btn-primary">查询</button>
                <button id="traceResetBtn" class="btn">重置</button>
                <div class="form-group-inline" style="margin-left:auto;">
                    <button id="traceExportJson" class="btn btn-success"><span data-icon="arrow-down"></span><span class="mtl-icon-text">导出 JSON</span></button>
                    <button id="traceExportCsv"  class="btn btn-success"><span data-icon="arrow-down"></span><span class="mtl-icon-text">导出 CSV</span></button>
                </div>
            </div>

            <div class="table-container">
                <div class="table-header"><h4 id="traceTableTitle">调用记录</h4></div>
                <div id="tracesTable">
                    <div class="empty-state"><p>请输入过滤条件后点击「查询」</p></div>
                </div>
            </div>
        </section>

        <!-- ===== 日志文件 tab ===== -->
        <section class="mtl-tab-panel" data-tab="logs" hidden>
            <div class="area-panel fade-in">
                <h3><span data-icon="folder"></span><span>选择日志文件</span></h3>
                <div id="fileList" class="file-list">
                    <div class="loading">正在加载文件列表...</div>
                </div>
            </div>

            <div class="area-panel hidden fade-in" id="searchPanel">
                <h3><span data-icon="search"></span><span>搜索条件</span></h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="keyword">关键字</label>
                        <input type="text" id="keyword" placeholder="输入搜索关键字">
                    </div>
                    <div class="form-group">
                        <label for="level">日志级别</label>
                        <select id="level">
                            <option value="">全部</option>
                            <option value="ERROR">ERROR</option>
                            <option value="WARN">WARN</option>
                            <option value="INFO">INFO</option>
                            <option value="DEBUG">DEBUG</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pageSize">每页行数</label>
                        <select id="pageSize">
                            <option value="50">50</option>
                            <option value="100" selected>100</option>
                            <option value="200">200</option>
                            <option value="500">500</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="startTime">开始时间</label>
                        <input type="datetime-local" id="startTime">
                    </div>
                    <div class="form-group">
                        <label for="endTime">结束时间</label>
                        <input type="datetime-local" id="endTime">
                    </div>
                    <div class="form-group">
                        <label for="reverse">排序方式</label>
                        <select id="reverse">
                            <option value="true">最新在前</option>
                            <option value="false">最旧在前</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <button class="btn btn-primary" onclick="logsSearchLogs()"><span data-icon="search"></span><span class="mtl-icon-text">搜索日志</span></button>
                    <button class="btn"            onclick="logsResetLogs()"><span data-icon="refresh-cw"></span><span class="mtl-icon-text">重置搜索</span></button>
                    <button class="btn btn-success" onclick="logsDownloadLog()"><span data-icon="download"></span><span class="mtl-icon-text">下载日志</span></button>
                    <div class="realtime-controls">
                        <div class="connection-status">
                            <span class="status-indicator disconnected" id="connectionStatus"></span>
                            <span id="connectionText">未连接</span>
                        </div>
                        <button class="btn btn-toggle" id="realtimeToggleBtn" onclick="logsToggleRealtimeMonitor()"><span data-icon="radio"></span><span class="mtl-icon-text">实时监控</span></button>
                        <button class="btn" disabled id="clearRealtimeBtn" onclick="logsClearRealtimeLogs()"><span data-icon="trash"></span><span class="mtl-icon-text">清空日志</span></button>
                    </div>
                </div>
            </div>

            <div class="area-panel hidden fade-in" id="resultPanel">
                <div class="result-header">
                    <div>
                        <strong id="fileName"></strong>
                        <span id="fileInfo"></span>
                    </div>
                    <div id="resultStats"></div>
                </div>
                <div class="log-content" id="logContent">
                    <div class="loading">正在搜索日志...</div>
                </div>
                <div class="pagination">
                    <div class="pagination-info" id="paginationInfo"></div>
                    <div class="pagination-controls">
                        <button class="btn btn-primary" id="prevBtn" onclick="logsPreviousPage()">上一页</button>
                        <input type="number" id="currentPage" value="1" min="1" onchange="logsGoToPage()">
                        <span>/ <span id="totalPages">1</span></span>
                        <button class="btn btn-primary" id="nextBtn" onclick="logsNextPage()">下一页</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== 反编译 tab ===== -->
        <section class="mtl-tab-panel" data-tab="decompile" hidden>
            <div class="control-panel">
                <div class="form-row">
                    <div class="form-group" style="flex:2;">
                        <label for="decClassName">类全名</label>
                        <input type="text" id="decClassName" placeholder="如 com.example.Foo">
                    </div>
                    <div class="form-group" style="flex:2;">
                        <label for="decMethodName">方法名</label>
                        <input type="text" id="decMethodName" placeholder="如 doSomething">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label for="decTimeout">超时(秒)</label>
                        <input type="number" id="decTimeout" value="10" min="1" max="60">
                    </div>
                </div>
                <div class="form-row">
                    <button class="btn btn-primary" id="decSubmitBtn"><span data-icon="search"></span><span class="mtl-icon-text">反编译</span></button>
                    <button class="btn" id="decClearBtn">清空</button>
                </div>
            </div>
            <div class="area-panel">
                <pre id="decResult" class="decompile-output">// 结果会显示在这里</pre>
            </div>
        </section>
    </main>

    <div id="toast">Toast</div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="modalCloseBtn" data-icon="x"></span>
            <div id="trace-tree" class="modal-container"></div>
        </div>
    </div>
</body>
</html>
